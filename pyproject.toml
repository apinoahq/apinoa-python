[project]
name = "apinoa"
version = "0.1.0"
description = "Official Python SDK for the apinoa API: marketplace, social and image-translation data through one API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "apinoa" }]
keywords = ["apinoa", "amazon", "walmart", "shopify", "aliexpress", "tiktok", "reddit", "youtube", "instagram", "scraping", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.21.2",
  "pydantic>=1.9.2",
  "pydantic-core>=2.18.2; python_version >= '3.9'",
  "typing_extensions>=4.0.0",
]

[project.urls]
Homepage = "https://apinoa.com"
Documentation = "https://apinoa.com/docs"
Repository = "https://github.com/apinoahq/apinoa-python"
Issues = "https://github.com/apinoahq/apinoa-python/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apinoa"]

[tool.hatch.build.targets.sdist]
include = ["src/apinoa", "README.md", "LICENSE", "reference.md", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/live"
asyncio_mode = "auto"
