# Publishes to PyPI every version that is not there yet, on each push to main: the version in pyproject.toml is
# the release, so a push that does not change it publishes nothing. After the upload, the tag and the GitHub
# Release are made from that version's CHANGELOG section. No token: PyPI trusted publishing (OIDC) for this
# repository, this workflow and the `pypi` environment.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: a second push waits, then finds its version on PyPI or publishes the next one.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.12"
      - id: version
        name: is this version on PyPI yet?
        run: |
          v=$(uv version --short)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/apinoa/$v/json")
          case $code in
            200) echo "new=false" >> "$GITHUB_OUTPUT"; echo "apinoa $v is on PyPI already: nothing to publish" ;;
            404) echo "new=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "PyPI answered $code for apinoa $v" >&2; exit 1 ;;
          esac
      - if: steps.version.outputs.new == 'true'
        run: uv sync --locked
      - if: steps.version.outputs.new == 'true'
        run: uv run pytest
      - if: steps.version.outputs.new == 'true'
        run: uv build
      - if: steps.version.outputs.new == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: needs.build.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: tag and release, with the version's CHANGELOG section as the notes
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          awk -v h="## $V" '$0 == h { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > notes.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md
